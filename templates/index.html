<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotationLearner – Learn Chess Notation</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- navbar -->
  <nav class="navbar navbar-expand-md nl-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand nl-brand" href="#">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="NotationLearner logo" class="nl-logo-img" />
        NotationLearner
      </a>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto gap-md-4">
          <li class="nav-item">
            <a class="nav-link nl-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nl-link active" href="#">Play</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nl-link" href="#">Analyse Games</a>
          </li>
        </ul>

        <!-- Profile icon -->
        <div class="nl-profile-wrap">
          <button class="nl-profile-btn" aria-label="Profile">
            <i class="bi bi-person-circle"></i>
          </button>
        </div>
      </div>

    </div>
  </nav>

  <main class="nl-hero d-flex flex-column align-items-center justify-content-center">

    <div class="text-center nl-hero-content">
      <h1 class="nl-heading">Learn Chess Notation</h1>
      <p class="nl-subheading">Play real chess games using only algebraic notation</p>

      <div class="mt-5 mb-4">
        <button class="btn nl-btn-primary">
          Play
        </button>
      </div>

      <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
        <button class="btn nl-btn-secondary">
          <i class="bi bi-robot me-2"></i>Bot — Quick Game
        </button>
        <button class="btn nl-btn-secondary">
          <i class="bi bi-people me-2"></i>Play with a Friend
        </button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="nl-footer">
    <p class="mb-0">
      This is a student project.&nbsp;&nbsp;If you would like to help me refine this project,
      contact me at
      <a href="mailto:student@mail.com" class="nl-footer-link">
        student@mail.com
      </a>
    </p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
